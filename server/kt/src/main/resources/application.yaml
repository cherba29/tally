ktor:
  development: '$KTOR_DEVELOPMENT:false'
  application:
    modules:
      - com.cherba29.tally.ApplicationKt.graphQLModule
  deployment:
    # Explicit loopback eliminates IPv6 lookup delays and multi-interface binding
    # host: 127.0.0.1
    # Using default so that WSL2 http://localhost:8080 works.
    port: '$TALLY_PORT:8080'
    watch:
      - classes
      - resources

    # Thread sizing optimized for single-user local usage:
    # Eliminates thread contention, context-switching overhead, and cold-thread wakeups
    connectionGroupSize: 1
    workerGroupSize: 2
    callGroupSize: 2

    # Fast and clean shutdown for local process lifecycle
    shutdownGracePeriod: 500
    shutdownTimeout: 1500

graphql:
  schema:
    federation:
      enabled: false
      tracing:
        # Disable tracing instrumentation to eliminate per-request trace generation overhead
        enabled: false
  engine:
    # Retain schema introspection for local developer tools and GraphiQL
    introspection:
      enabled: true
    # Batch data loader execution using sync exhaustion
    batching:
      enabled: true
      strategy: SYNC_EXHAUSTION
    # APQ caches parsed and validated GraphQL Document ASTs in memory, eliminating query parsing
    # and validation latency spikes on recurring queries and warm-ups
    automaticPersistedQueries:
      enabled: true
  server:
    subscription:
      connectionInitTimeout: 60000

tally:
  data:
    # https://ktor.io/docs/server-configuration-file.html#environment-variables
    # Primary data directory env var; falls back to TALLY_PATH or ./sample-data when unset.
    path: '$?TALLY_FILES'
    legacyPath: '$?TALLY_PATH'
  client:
    # Optional filesystem override; when unset, embedded classpath /static resources are served.
    path: '$?TALLY_CLIENT_BUNDLE'
