name: CI/CD

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  client:
    name: Client (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.8

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: client
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Puppeteer Chrome
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('client/pnpm-lock.yaml') }}

      - name: Install Puppeteer Chrome
        working-directory: client
        run: '"$(realpath node_modules/@web/test-runner-puppeteer)/node_modules/.bin/puppeteer" browsers install chrome'

      - name: Build client
        working-directory: client
        run: pnpm build

      - name: Test client
        working-directory: client
        run: pnpm test

  server:
    name: Server (Test & Package Fat JAR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.8

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: client
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and package fat JAR
        working-directory: server/kt
        run: ./gradlew test buildFatJar

      - name: Upload fat JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: tally-all-jar
          path: server/kt/build/libs/tally-all.jar
          retention-days: 14

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-jacoco-report
          path: server/kt/build/reports/jacoco/test/html
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [client, server]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download fat JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: tally-all-jar
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$(mktemp)"
          if [[ -f CHANGELOG.md ]]; then
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          fi
          if [[ -s "$NOTES_FILE" ]]; then
            gh release create "${GITHUB_REF_NAME}" dist/tally-all.jar \
              --title "Tally ${GITHUB_REF_NAME}" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "${GITHUB_REF_NAME}" dist/tally-all.jar \
              --title "Tally ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
