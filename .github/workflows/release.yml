name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.4.0 or v0.4.0). Leave empty to use version from client/package.json.'
        required: false
        type: string
      draft:
        description: 'Create as a draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    name: Validate Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve and validate version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PKG_VERSION="$(node -p "require('./client/package.json').version")"
          GRADLE_VERSION="$(sed -nE 's/^version = "([^"]+)"/\1/p' server/kt/build.gradle.kts | head -n 1)"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
          else
            VERSION="${PKG_VERSION}"
            TAG="v${VERSION}"
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: Invalid version '${VERSION}'. Expected semver like 0.4.0." >&2
            exit 1
          fi

          if [[ "${VERSION}" != "${PKG_VERSION}" ]]; then
            echo "Error: Release version '${VERSION}' does not match client/package.json version '${PKG_VERSION}'." >&2
            exit 1
          fi

          if [[ "${VERSION}" != "${GRADLE_VERSION}" ]]; then
            echo "Error: Release version '${VERSION}' does not match server/kt/build.gradle.kts version '${GRADLE_VERSION}'." >&2
            exit 1
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Error: GitHub Release '${TAG}' already exists." >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Validated release ${TAG} (client=${PKG_VERSION}, server=${GRADLE_VERSION})"

  client:
    name: Client (Build & Test)
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.8

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: client
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Puppeteer Chrome
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('client/pnpm-lock.yaml') }}

      - name: Install Puppeteer Chrome
        working-directory: client
        run: '"$(realpath node_modules/@web/test-runner-puppeteer)/node_modules/.bin/puppeteer" browsers install chrome'

      - name: Build client
        working-directory: client
        run: pnpm build

      - name: Test client
        working-directory: client
        run: pnpm test

  server:
    name: Server (Test & Package Fat JAR)
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.8

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: client
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and package fat JAR
        working-directory: server/kt
        run: ./gradlew test buildFatJar

      - name: Upload fat JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: tally-all-jar
          path: server/kt/build/libs/tally-all.jar
          retention-days: 7

  publish:
    name: Publish GitHub Release (${{ needs.prepare.outputs.tag }})
    needs: [prepare, client, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download fat JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: tally-all-jar
          path: dist

      - name: Generate SHA-256 checksum
        working-directory: dist
        run: sha256sum tally-all.jar > tally-all.jar.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_DRAFT: ${{ inputs.draft }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          NOTES_FILE="$(mktemp)"
          if [[ -f CHANGELOG.md ]]; then
            awk -v ver="${VERSION}" '
              index($0, "## [" ver "]") == 1 { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > "${NOTES_FILE}"
          fi

          ARGS=("${TAG}" "dist/tally-all.jar" "dist/tally-all.jar.sha256" "--title" "Tally ${TAG}")

          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            ARGS+=("--target" "${GITHUB_SHA}")
          fi

          if [[ "${IS_DRAFT}" == "true" ]]; then
            ARGS+=("--draft")
          fi

          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            ARGS+=("--prerelease")
          fi

          if [[ -s "${NOTES_FILE}" ]]; then
            ARGS+=("--notes-file" "${NOTES_FILE}")
          else
            ARGS+=("--generate-notes")
          fi

          gh release create "${ARGS[@]}"
